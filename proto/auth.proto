syntax = "proto3";

package auth.v1;

import "google/protobuf/empty.proto";

service AuthService {
    rpc SendOtp (SendOtpRequest) returns (SendOtpResponse);
    rpc VerifyOtp (VerifyOtpRequest) returns (VerifyOtpResponse);
    rpc Refresh (RefreshRequest) returns (RefreshResponse);

    rpc FindContactByPhone (FindContactByPhoneRequest) returns (FindContactByPhoneResponse);
    rpc IssueVoiceOtp (IssueVoiceOtpRequest) returns (IssueVoiceOtpResponse);
    rpc VerifyVoiceOtp (VerifyVoiceOtpRequest) returns (VerifyVoiceOtpResponse);

    rpc CreateVoiceLink (CreateVoiceLinkRequest) returns (CreateVoiceLinkResponse);
    rpc ConsumeVoiceLink (ConsumeVoiceLinkRequest) returns (ConsumeVoiceLinkResponse);

    rpc SaveFeedback (SaveFeedbackRequest) returns (SaveFeedbackResponse);
    rpc ListFeedback (ListFeedbackRequest) returns (ListFeedbackResponse);

    rpc TelegramInit (google.protobuf.Empty) returns (TelegramInitResponse);
    rpc TelegramVerify (TelegramVerifyRequest) returns (TelegramVerifyResponse);
    rpc TelegramComplete (TelegramCompleteRequest) returns (TelegramCompleteResponse);
    rpc TelegramConsume (TelegramConsumeRequest) returns (TelegramConsumeResponse);
}

message SendOtpRequest {
    string identifier = 1;
    string type = 2;
}

message SendOtpResponse {
    bool ok = 1;
}

message VerifyOtpRequest {
    string identifier = 1;
    string type = 2;
    string code = 3;
}

message VerifyOtpResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message RefreshRequest {
    string refresh_token = 1;
}

message RefreshResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message TelegramInitResponse {
    string url = 1;
}

message TelegramVerifyRequest {
    map<string, string> query = 1;
}

message TelegramVerifyResponse {
    oneof result {
        string url = 1;
        string access_token = 2;
        string refresh_token = 3;
    }
}

message TelegramCompleteRequest {
    string session_id = 1;
    string phone = 2;
}

message TelegramCompleteResponse {
    string session_id = 1;
}

message TelegramConsumeRequest {
    string session_id = 1;
}

message TelegramConsumeResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message FindContactByPhoneRequest {
    string phone = 1;
}

message FindContactByPhoneResponse {
    string account_id = 1;
    string email = 2;
}

message IssueVoiceOtpRequest {
    string account_id = 1;
}

message IssueVoiceOtpResponse {
    string code = 1;
}

message VerifyVoiceOtpRequest {
    string account_id = 1;
    string code = 2;
}

message VerifyVoiceOtpResponse {
    string access_token = 1;
}

message SaveFeedbackRequest {
    string type = 1;
    string text = 2;
    string name = 3;
    string phone = 4;
}

message SaveFeedbackResponse {
    string id = 1;
    string expires_at = 2;
}

message ListFeedbackRequest {
    string type = 1;
    int32 limit = 2;
}

message FeedbackItem {
    string id = 1;
    string type = 2;
    string text = 3;
    string name = 4;
    string phone = 5;
    string created_at = 6;
    string expires_at = 7;
}

message ListFeedbackResponse {
    repeated FeedbackItem items = 1;
}

message CreateVoiceLinkRequest {
    string account_id = 1;
    string identity = 2;
}

message CreateVoiceLinkResponse {
    int32 expires_in_seconds = 1;
}

message ConsumeVoiceLinkRequest {
    string identity = 1;
}

message ConsumeVoiceLinkResponse {
    bool linked = 1;
    string access_token = 2;
    string email = 3;
}
